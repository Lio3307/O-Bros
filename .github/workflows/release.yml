name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create the draft release
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Create the draft once, before the builds start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "${TAG}"; then
            echo "A release for ${TAG} already exists."
            exit 0
          fi
          NOTES="docs/releases/${TAG}.md"
          if [ -f "${NOTES}" ]; then
            gh release create "${TAG}" --draft --title "O-BROS ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" --draft --title "O-BROS ${VERSION}" --notes ""
          fi

  release:
    name: Build on ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build the app
        run: npm run build

      - name: Package and publish to the GitHub release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
