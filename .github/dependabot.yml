version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        versions:
          - '>=7.0.0'
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      build-tools:
        patterns:
          - vite
          - vitest
          - electron-vite
          - '@vitejs/*'
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
          - codemirror
      xterm:
        patterns:
          - '@xterm/*'
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
